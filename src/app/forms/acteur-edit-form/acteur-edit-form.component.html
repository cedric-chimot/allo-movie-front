<div class="edit-form">

  <div class="form-title">

    <h2>
      Modifier l'acteur
    </h2>

  </div>

  <form
    #acteurForm="ngForm"
    (ngSubmit)="modifierActeur()"
  >

    <div class="form-group">

      <label for="nom">
        Nom
      </label>

      <input
        type="text"
        id="nom"
        name="nom"
        [(ngModel)]="acteur.nom"
        required
      >

    </div>

    <div class="form-group">

      <label for="prenom">
        Prénom
      </label>

      <input
        type="text"
        id="prenom"
        name="prenom"
        [(ngModel)]="acteur.prenom"
        required
      >

    </div>

    <div class="form-actions">

      <button
        type="submit"
        class="btn-submit"
        [disabled]="acteurForm.invalid"
      >
        Modifier
      </button>

      <button
        type="button"
        class="btn-cancel"
        (click)="fermer()"
      >
        Annuler
      </button>

    </div>

  </form>

</div>
