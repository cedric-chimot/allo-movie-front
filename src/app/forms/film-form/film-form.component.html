<div class="form-container">

  <h2 class="form-title">
    Ajouter un film
  </h2>

  <form (ngSubmit)="ajouterFilm()" #filmForm="ngForm">

    <div class="form-group">

      <label for="titre">
        Titre
      </label>

      <input
        type="text"
        id="titre"
        name="titre"
        [(ngModel)]="film.titre"
        required
        placeholder="Titre du film"
      >

    </div>


    <div class="form-group">

      <label for="dateSortie">
        Date de sortie
      </label>

      <input
        type="date"
        id="dateSortie"
        name="dateSortie"
        [(ngModel)]="film.dateSortie"
        required
      >
    </div>


    <div class="form-group">

      <label for="synopsis">
        Synopsis
      </label>

      <textarea
        id="synopsis"
        name="synopsis"
        [(ngModel)]="film.synopsis"
        required
        rows="5"
        placeholder="Synopsis du film"
      ></textarea>

    </div>


    <div class="form-group">

      <label for="image">
        URL de l'affiche
      </label>

      <input
        type="text"
        id="image"
        name="image"
        [(ngModel)]="film.image"
        placeholder="https://..."
      >

    </div>


    <div class="form-group">

      <label for="noteMoyenne">
        Note moyenne
      </label>

      <input
        type="number"
        id="noteMoyenne"
        name="noteMoyenne"
        [(ngModel)]="film.noteMoyenne"
        min="0"
        max="10"
        step="0.1"
        placeholder="0 à 10"
      >
    </div>


    <div class="form-actions">

      <button
        type="submit"
        class="btn-submit"
        [disabled]="filmForm.invalid"
      >
        Ajouter le film
      </button>

      <button
        type="button"
        class="btn-cancel"
        (click)="fermer()"
      >
        Annuler
      </button>

    </div>

  </form>

</div>
