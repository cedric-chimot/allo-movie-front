<div class="edit-form">

  <div class="form-title">

    <h2>
      Modifier la catégorie
    </h2>

  </div>

  <form
    #categorieForm="ngForm"
    (ngSubmit)="modifierCategorie()"
  >

    <div class="form-group">

      <label for="categorie">
        Catégorie
      </label>

      <input
        type="text"
        id="categorie"
        name="categorie"
        [(ngModel)]="categorie.categorie"
        required
      >

    </div>

    <div class="form-actions">

      <button
        type="submit"
        class="btn-submit"
        [disabled]="categorieForm.invalid"
      >
        Modifier
      </button>

      <button
        type="button"
        class="btn-cancel"
        (click)="fermer()"
      >
        Annuler
      </button>

    </div>

  </form>

</div>
